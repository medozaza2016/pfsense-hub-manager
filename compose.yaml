services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PFSENSE_DEVICE_ID: ${PFSENSE_DEVICE_ID:?Set PFSENSE_DEVICE_ID}
      PFSENSE_DEVICE_NAME: ${PFSENSE_DEVICE_NAME:?Set PFSENSE_DEVICE_NAME}
      PFSENSE_DEVICE_LOCATION: ${PFSENSE_DEVICE_LOCATION:-}
      PFSENSE_EDITION: ${PFSENSE_EDITION:-unknown}
      PFSENSE_API_BASE_URL: ${PFSENSE_API_BASE_URL:?Set PFSENSE_API_BASE_URL}
      PFSENSE_API_KEY_FILE: /run/secrets/pfsense_api_key
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      PFSENSE_API_TIMEOUT_MS: ${PFSENSE_API_TIMEOUT_MS:-10000}
      HUB_DEPLOYMENT_AGENT_SOCKET: ${HUB_DEPLOYMENT_AGENT_SOCKET:-}
      HUB_DEPLOYMENT_AGENT_TOKEN: ${HUB_DEPLOYMENT_AGENT_TOKEN:-}
      HUB_DEPLOYMENT_AGENT_API_PORT: ${HUB_AGENT_API_PORT:-3001}
      PFSENSE_CA_FILE: ${PFSENSE_CA_FILE:-}
    volumes: ["./certs:/run/certs:ro", "./run/host-agent:/run/pfsense-hub"]
    group_add: ["${HUB_AGENT_GID:-2000}"]
    secrets: [pfsense_api_key, app_encryption_key]
    expose: ["3000"]
    ports: ["127.0.0.1:${HUB_AGENT_API_PORT:-3001}:3000"]
    networks: [backend]
    extra_hosts:
      - "pfsense-60bd06fe256ce:172.10.50.1"
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt: [no-new-privileges:true]
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    restart: unless-stopped
    ports: ["${HUB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    networks: [backend]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]
  code-server:
    image: codercom/code-server:latest
    restart: unless-stopped
    environment:
      DOCKER_USER: coder
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export PASSWORD="$$(cat /run/secrets/code_server_password)"; exec /usr/bin/entrypoint.sh --bind-addr 0.0.0.0:8080 --auth password --disable-telemetry /home/coder/project'
    ports: ["127.0.0.1:${CODE_SERVER_PORT:-8443}:8080"]
    volumes:
      - ./:/home/coder/project
      - code_server_config:/home/coder/.config
      - code_server_data:/home/coder/.local/share/code-server
    secrets: [code_server_password]
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
  code_server_config:
  code_server_data:
networks:
  backend: {driver: bridge}
secrets:
  pfsense_api_key:
    file: ./secrets/pfsense_api_key
  app_encryption_key:
    file: ./secrets/runtime/app_encryption_key
  code_server_password:
    file: ./secrets/code_server_password
