services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PFSENSE_DEVICE_ID: ${PFSENSE_DEVICE_ID:-}
      PFSENSE_DEVICE_NAME: ${PFSENSE_DEVICE_NAME:-}
      PFSENSE_DEVICE_LOCATION: ${PFSENSE_DEVICE_LOCATION:-}
      PFSENSE_EDITION: ${PFSENSE_EDITION:-unknown}
      PFSENSE_API_BASE_URL: ${PFSENSE_API_BASE_URL:-}
      PFSENSE_API_KEY_FILE: /run/secrets/pfsense_api_key
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      PFSENSE_API_TIMEOUT_MS: ${PFSENSE_API_TIMEOUT_MS:-10000}
      PFSENSE_OBSERVATION_CACHE_MS: ${PFSENSE_OBSERVATION_CACHE_MS:-10000}
      PFSENSE_OBSERVATION_ERROR_CACHE_MS: ${PFSENSE_OBSERVATION_ERROR_CACHE_MS:-2000}
      PFSENSE_POLLING_ENABLED: ${PFSENSE_POLLING_ENABLED:-false}
      PFSENSE_POLLING_INTERVAL_MS: ${PFSENSE_POLLING_INTERVAL_MS:-60000}
      PFSENSE_POLLING_CONCURRENCY: ${PFSENSE_POLLING_CONCURRENCY:-2}
      PFSENSE_POLLING_JITTER_MS: ${PFSENSE_POLLING_JITTER_MS:-15000}
      PFSENSE_POLLING_RETENTION_DAYS: ${PFSENSE_POLLING_RETENTION_DAYS:-30}
      HUB_DEPLOYMENT_AGENT_SOCKET: ${HUB_DEPLOYMENT_AGENT_SOCKET:-}
      HUB_DEPLOYMENT_AGENT_TOKEN: ${HUB_DEPLOYMENT_AGENT_TOKEN:-}
      HUB_DEPLOYMENT_AGENT_API_PORT: ${HUB_AGENT_API_PORT:-3001}
      HUB_ACCESS_DEPLOYMENT_ENABLED: ${HUB_ACCESS_DEPLOYMENT_ENABLED:-false}
      HUB_HOST_MONITORING_ENABLED: ${HUB_HOST_MONITORING_ENABLED:-false}
      HUB_HOST_OPERATIONS_ENABLED: ${HUB_HOST_OPERATIONS_ENABLED:-false}
      HUB_HOST_OPERATION_TIMEOUT_MS: ${HUB_HOST_OPERATION_TIMEOUT_MS:-180000}
      PFSENSE_CA_FILE: ${PFSENSE_CA_FILE:-}
    volumes: ["./certs:/run/certs:ro", "./run/host-agent:/run/pfsense-hub:ro"]
    group_add: ["${HUB_AGENT_GID:-2000}"]
    secrets: [pfsense_api_key, app_encryption_key]
    expose: ["3000"]
    ports: ["127.0.0.1:${HUB_AGENT_API_PORT:-3001}:3000"]
    networks: [backend]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt: [no-new-privileges:true]
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    restart: unless-stopped
    ports: ["${HUB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    networks: [backend]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
networks:
  backend: {driver: bridge}
secrets:
  pfsense_api_key:
    file: ./secrets/pfsense_api_key
  app_encryption_key:
    file: ./secrets/runtime/app_encryption_key
