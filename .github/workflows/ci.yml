name: CI
on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pfsense-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify generated API matrix is current
        run: |
          node scripts/generate-api-matrix.mjs
          git diff --exit-code -- docs/API-MATRIX.generated.md
      - name: Validate Compose and build container images
        run: |
          cp .env.example .env
          mkdir -p secrets
          printf '%s' 'ci-placeholder-not-a-real-key' > secrets/pfsense_api_key
          docker compose config -q
          docker compose build
