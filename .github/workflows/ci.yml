name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Validate Compose and build container images
        run: |
          cp .env.example .env
          mkdir -p secrets
          printf '%s' 'ci-placeholder-not-a-real-key' > secrets/pfsense_api_key
          docker compose config -q
          docker compose build
